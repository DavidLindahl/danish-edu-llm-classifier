[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "danish-edu-llm-classifier"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.0.0",
    "transformers>=4.30.0",
    "scikit-learn>=1.3.0",
    "pandas>=1.5.0",
    "numpy>=1.24.0",
    "PyYAML>=6.0",
    "datasets>=2.12.0",
    "accelerate>=0.20.0",
    "wandb>=0.15.0",
    "tqdm>=4.65.0",
    "seaborn>=0.12.0",
    "matplotlib>=3.7.0",
    "evaluate>=0.4.0",
    "streamlit>=1.20.0",
]

[dependency-groups]
dev = [
    "ruff>=0.14.10",
]


[tool.ruff]
lint.select = ["I"]
line-length = 120



[project.scripts]
classifier = "main:main"
train = "src.training.train:main"


[tool.hatch.build.targets.wheel]
packages = ["src"]